<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OG AI DIRECTOR PRO • Studio Produksi Konten & Sutradara AI</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              cyan: '#06b6d4',
              teal: '#14b8a6',
              amber: '#f59e0b',
              emerald: '#10b981',
              dark: '#070b14',
              surface: '#0e1626',
              card: '#0a0f1d'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070b14;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070b14; }
    ::-webkit-scrollbar-thumb { background: #164e63; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    .cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }
  </style>
</head>
<body class="bg-[#070b14] cyber-grid text-slate-100 min-h-screen selection:bg-cyan-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICONS (Clean SVG components) ---
    const IconClapper = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 11v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8H4Z"/><path d="m4 11-.88-2.87a2 2 0 0 1 1.33-2.5l11.45-3.52a2 2 0 0 1 2.5 1.33L20 7"/><path d="m6.6 4.9 2.9 2.1"/><path d="m11.5 3.4 2.9 2.1"/><path d="m16.4 1.9 2.9 2.1"/></svg>
    );
    const IconUsers = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );
    const IconCamera = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    );
    const IconMegaphone = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
    );
    const IconGrid = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
    );
    const IconFilm = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="20" height="20" x="2" y="2" rx="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></svg>
    );
    const IconRoute = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
    );
    const IconCopy = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    );
    const IconCheck = () => (
      <svg className="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 6 9 17l-5-5"/></svg>
    );
    const IconDownload = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
    );
    const IconPlay = () => (
      <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('modul03');
      const [toast, setToast] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      // --- Modul 03 (Affiliate Prompt) State ---
      const [affProduct, setAffProduct] = useState('Lumina Glow Hydra-Peptide Serum');
      const [affAction, setAffAction] = useState('Meneteskan serum ke pipi, efek glowing instan dan kulit dewy kenyal');
      const [affDuration, setAffDuration] = useState('40 detik (4 Shot @10s)');
      const [affTalent, setAffTalent] = useState('Wanita Indonesia 24yo (Dewy Glass Skin)');
      const [affUploadedImg, setAffUploadedImg] = useState(null);
      const [affShots, setAffShots] = useState([
        {
          id: 1,
          time: '00:00 — 00:10',
          title: 'THE HOOK',
          focus: 'Pain Point & Agitasi Dehidrasi',
          vo: '"Pori-pori besar dan kulit dehidrasi bikin makeup gampang cakey? Stop, ini rahasia glass skin 7 hari aku!"',
          prompt: 'Commercial UGC video, 24yo Indonesian beauty creator with luminous glass skin, holding luxury Lumina Glow serum bottle smiling warmly towards smartphone, 35mm lens, natural daylight, photorealistic 8k.'
        },
        {
          id: 2,
          time: '00:10 — 00:20',
          title: 'TEXTURE MACRO',
          focus: 'Sensory Formula & Droplet Flow',
          vo: '"Teksturnya watery gel, ada triple hyaluronic acid dan peptide. Langsung lumer dan mengunci hidrasi instan!"',
          prompt: 'Cinematic ultra-macro close-up of Lumina Glow serum droplet sliding smoothly on glowing female cheek, golden sunlit refraction, microscopic hydration bubbles, 85mm macro lens, 8k.'
        },
        {
          id: 3,
          time: '00:20 — 00:30',
          title: 'APPLICATION',
          focus: 'Transformasi & Kenyalan Alami',
          vo: '"Nggak lengket sama sekali, kulit langsung kerasa kenyal, plumpy, dan glowing seharian bahkan sebelum makeup!"',
          prompt: 'Medium close-up shot of creator gently patting Lumina Glow serum onto face with soft fingertips, radiant natural bounce, soft spa studio lighting, 50mm prime f/1.4, 8k.'
        },
        {
          id: 4,
          time: '00:30 — 00:40',
          title: 'HIGH CONVERSION CTA',
          focus: 'Flash Sale & Keranjang Kuning',
          vo: '"Khusus peluncuran hari ini ada voucher flash sale potongan 40% plus gratis pouch eksklusif di keranjang kuning sekarang!"',
          prompt: 'High-energy commercial UGC call-to-action video, creator holding Lumina Glow bottle pointing happily towards yellow shopping cart button, high conversion TikTok Shop ads format, 8k.'
        }
      ]);

      // --- Modul 01 (Character Sheet) State ---
      const [charName, setCharName] = useState('Captain Sarah Connor');
      const [charArchetype, setCharArchetype] = useState('Tactical Cyberpunk Detective');
      const [charResultPrompt, setCharResultPrompt] = useState(
        'full body character turnaround, 4 angles, front view, 3/4 view, side view, back view, Captain Sarah Connor, tactical cyberpunk detective, female, sharp determined expression, messy top bun hairstyle, cybernetic neural temple implant glowing soft cyan, dark navy blue tactical jacket with cyan seam piping, black tactical cargo pants, solid pure white background #FFFFFF, no shadows, ultra high resolution --face_lock 100% --wardrobe_sync true --aspect 16:9'
      );

      // --- Modul 11 (Video Screencast & Masterclass) State ---
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [videoStep, setVideoStep] = useState(1);

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2500);
      };

      const copyToClipboard = (text, label) => {
        navigator.clipboard.writeText(text);
        triggerToast(`${label} berhasil disalin!`);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            setAffUploadedImg(reader.result);
            triggerToast("Foto produk berhasil diunggah!");
          };
          reader.readAsDataURL(file);
        }
      };

      const handleGenerateAffiliate = () => {
        setIsGenerating(true);
        setTimeout(() => {
          setIsGenerating(false);
          const p = affProduct || "Produk Pilihan";
          setAffShots([
            {
              id: 1,
              time: '00:00 — 00:10',
              title: 'THE HOOK',
              focus: 'Stop-Scrolling Visual & Problem Hook',
              vo: `"${affProduct}: Solusi kilat untuk transformasi nyata yang bikin semua orang melirik sejak hari pertama!"`,
              prompt: `Commercial UGC video, creator holding ${p} smiling warmly towards camera, 35mm lens, natural studio illumination, photorealistic 8k.`
            },
            {
              id: 2,
              time: '00:10 — 00:20',
              title: 'TEXTURE MACRO',
              focus: 'Detail Tekstur Formula & Kemurnian',
              vo: `"Formula inovatif dengan partikel aktif yang cepat menyerap dan memberikan rasa nyaman seketika!"`,
              prompt: `Cinematic ultra-macro close-up shot of ${p}, highlighting droplet textures, glossy refraction, 85mm macro lens, 8k resolution.`
            },
            {
              id: 3,
              time: '00:20 — 00:30',
              title: 'APPLICATION',
              focus: 'Aksi Nyata & Kepuasan Hasil',
              vo: `"Rasakan sensasi pemakaian yang lembut dan hasil nyata tanpa ribet setiap hari!"`,
              prompt: `Medium close-up shot of creator demonstrating ${affAction || p}, radiant expression, authentic lifestyle aesthetic, 50mm prime, 8k.`
            },
            {
              id: 4,
              time: '00:30 — 00:40',
              title: 'HIGH CONVERSION CTA',
              focus: 'Urgensi Penawaran & Tombol Pembelian',
              vo: `"Stok promo bundling terbatas diskon hari ini! Klik tombol keranjang kuning sekarang sebelum kehabisan!"`,
              prompt: `High-conversion commercial call-to-action video, creator holding ${p} pointing excitedly down to shopping basket button, e-commerce format, 8k.`
            }
          ]);
          triggerToast("Naskah 4 Shot 10s berhasil diracik!");
        }, 600);
      };

      const speakGuideVoice = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'id-ID';
          utterance.rate = 1.0;
          utterance.onend = () => setIsPlayingAudio(false);
          utterance.onerror = () => setIsPlayingAudio(false);
          setIsPlayingAudio(true);
          window.speechSynthesis.speak(utterance);
          triggerToast("Memutar suara instruktur panduan...");
        } else {
          triggerToast("Browser tidak mendukung sintesis suara.");
        }
      };

      const stopVoice = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setIsPlayingAudio(false);
        }
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-[#090e1c] border border-cyan-400 text-cyan-300 text-xs font-mono shadow-[0_0_25px_rgba(6,182,212,0.3)] flex items-center gap-2.5 animate-bounce">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              {toast}
            </div>
          )}

          {/* LEFT SIDEBAR NAVIGATION */}
          <aside className="w-full md:w-72 bg-[#090e1c]/95 border-r border-cyan-950 p-4 shrink-0 flex flex-col justify-between backdrop-blur-md">
            <div className="space-y-6">
              {/* BRAND HEADER */}
              <div className="flex items-center gap-3 pb-4 border-b border-cyan-950">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-teal-400 flex items-center justify-center text-[#070b14] font-black text-sm shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                  OG
                </div>
                <div>
                  <h1 className="text-sm font-black text-white tracking-wide">OG AI DIRECTOR</h1>
                  <span className="text-[10px] text-cyan-400 font-mono tracking-widest uppercase">PRO LIFETIME v3.1</span>
                </div>
              </div>

              {/* MODULE MENU */}
              <div className="space-y-1">
                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-2 font-mono">11 Modul Produksi</div>
                {[
                  { id: 'modul01', label: '01. Character Sheet', badge: '100%' },
                  { id: 'modul02', label: '02. Image Studio', badge: '8K' },
                  { id: 'modul03', label: '03. Affiliate Prompt', badge: 'LIVE' },
                  { id: 'modul04', label: '04. AI Influencer Vault', badge: 'TALENT' },
                  { id: 'modul05', label: '05. General Prompt', badge: 'FILM' },
                  { id: 'modul06', label: '06. Storyboard Grid', badge: 'PNG 4K' },
                  { id: 'modul07', label: '07. AI Generator Pipeline', badge: '10 IDE' },
                  { id: 'modul08', label: '08. Generative AI Action', badge: 'MULTI' },
                  { id: 'modul09', label: '09. SeaDance Motion', badge: 'TARI' },
                  { id: 'modul10', label: '10. Bridge Google Flow', badge: '8S / 720P' },
                  { id: 'modul11', label: '11. Video Masterclass', badge: 'AUDIO' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs transition-all ${
                      activeTab === item.id
                        ? 'bg-gradient-to-r from-cyan-500/20 to-teal-500/10 text-cyan-300 font-extrabold border border-cyan-500/40 shadow-inner'
                        : 'text-slate-400 hover:bg-[#0f172a] hover:text-slate-200'
                    }`}
                  >
                    <span>{item.label}</span>
                    <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-black/40 text-cyan-400 border border-cyan-900/50">
                      {item.badge}
                    </span>
                  </button>
                ))}
              </div>
            </div>

            {/* STATUS FOOTER */}
            <div className="pt-4 border-t border-cyan-950 font-mono text-[10px] text-slate-400 space-y-1">
              <div className="flex items-center justify-between">
                <span className="text-emerald-400 flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  API Pool Connected
                </span>
                <span className="text-cyan-400">Gemini 3.1 & Veo</span>
              </div>
              <div className="text-slate-500 text-[9px]">Lifetime License • Lynk.id Verified</div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full space-y-6">
            
            {/* TOP BAR / CONTEXT HEADER */}
            <div className="p-4 rounded-2xl bg-[#0a0f1d] border border-cyan-950 flex flex-wrap items-center justify-between gap-3 font-mono text-xs shadow-lg">
              <div className="flex items-center gap-3">
                <span className="px-2.5 py-1 rounded bg-cyan-950 text-cyan-400 border border-cyan-800 font-bold uppercase">
                  {activeTab.toUpperCase()}
                </span>
                <span className="text-white font-bold tracking-wide">
                  {activeTab === 'modul03' && 'AFFILIATE PROMPT & E-COMMERCE UGC WORKBENCH'}
                  {activeTab === 'modul01' && 'CHARACTER SHEET STUDIO • 100% KONSISTENSI LATAR PUTIH'}
                  {activeTab === 'modul06' && 'STORYBOARD GRID STUDIO • DOKUMEN KOMPOSIT 4 PANEL'}
                  {activeTab === 'modul11' && 'PUSAT PANDUAN VIDEO INTERAKTIF & AUDIO NYATA'}
                  {!['modul03', 'modul01', 'modul06', 'modul11'].includes(activeTab) && 'OG AI DIRECTOR PRO ENVIRONMENT'}
                </span>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] text-slate-400">LATENCY: <strong className="text-cyan-300">24ms</strong></span>
                <button
                  onClick={() => triggerToast("Firestore Cloud Synced!")}
                  className="px-3 py-1 bg-cyan-950/60 hover:bg-cyan-900 text-cyan-300 rounded-lg border border-cyan-800 text-[10px]"
                >
                  Cloud Synced
                </button>
              </div>
            </div>

            {/* TAB CONTENT: MODUL 03 - AFFILIATE PROMPT */}
            {activeTab === 'modul03' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* FORM PANEL */}
                  <div className="p-5 rounded-3xl bg-[#0a0f1d] border border-cyan-950 space-y-4 shadow-xl">
                    <h2 className="text-xs font-bold text-cyan-300 font-mono uppercase tracking-wider flex items-center justify-between">
                      <span>1. Parameter Produk & Talent</span>
                      <span className="text-[10px] text-amber-400">10s / Shot</span>
                    </h2>

                    {/* UPLOAD SLOT */}
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1.5 font-bold uppercase font-mono">Upload Foto Produk (Komersial)</label>
                      <div className="border border-dashed border-cyan-900 rounded-2xl p-3 text-center bg-[#050811] relative group overflow-hidden">
                        {affUploadedImg ? (
                          <div className="space-y-2">
                            <img src={affUploadedImg} alt="Produk" className="w-full h-32 object-cover rounded-xl border border-cyan-900 shadow-md" />
                            <button onClick={() => setAffUploadedImg(null)} className="text-[10px] text-rose-400 hover:underline">Hapus Foto</button>
                          </div>
                        ) : (
                          <label className="cursor-pointer block py-4">
                            <div className="text-xs font-bold text-slate-200">Klik / Seret Foto Botol Produk</div>
                            <span className="text-[10px] text-slate-500">JPG/PNG maks 20MB (Lumina Glow Serum)</span>
                            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                          </label>
                        )}
                      </div>
                    </div>

                    <div className="space-y-3">
                      <div>
                        <label className="text-[11px] text-slate-400 block mb-1">Nama Produk Komersial</label>
                        <input
                          type="text"
                          value={affProduct}
                          onChange={(e) => setAffProduct(e.target.value)}
                          className="w-full bg-[#050811] border border-cyan-950 focus:border-cyan-400 rounded-xl px-3.5 py-2 text-xs text-white outline-none"
                        />
                      </div>

                      <div>
                        <label className="text-[11px] text-slate-400 block mb-1">Aksi & Fokus Aktor</label>
                        <input
                          type="text"
                          value={affAction}
                          onChange={(e) => setAffAction(e.target.value)}
                          className="w-full bg-[#050811] border border-cyan-950 focus:border-cyan-400 rounded-xl px-3.5 py-2 text-xs text-white outline-none"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[11px] text-slate-400 block mb-1">Durasi</label>
                          <select
                            value={affDuration}
                            onChange={(e) => setAffDuration(e.target.value)}
                            className="w-full bg-[#050811] border border-cyan-950 rounded-xl px-2.5 py-2 text-xs text-white outline-none"
                          >
                            <option>40 detik (4 Shot @10s)</option>
                            <option>30 detik (3 Shot @10s)</option>
                            <option>20 detik (2 Shot @10s)</option>
                            <option>10 detik (1 Shot @10s)</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-[11px] text-slate-400 block mb-1">Karakter Talent</label>
                          <input
                            type="text"
                            value={affTalent}
                            onChange={(e) => setAffTalent(e.target.value)}
                            className="w-full bg-[#050811] border border-cyan-950 rounded-xl px-2.5 py-2 text-xs text-white outline-none"
                          />
                        </div>
                      </div>

                      <button
                        onClick={handleGenerateAffiliate}
                        disabled={isGenerating}
                        className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 via-teal-400 to-emerald-400 hover:from-cyan-300 hover:to-teal-300 text-slate-950 text-xs font-black shadow-lg shadow-cyan-500/20 uppercase tracking-wider transition-all"
                      >
                        {isGenerating ? "MERACIK NASKAH & MASTER PROMPTS..." : "GENERATE MASTER NASKAH & PROMPTS"}
                      </button>
                    </div>
                  </div>

                  {/* SHOTS OUTPUT PANEL */}
                  <div className="lg:col-span-2 space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-cyan-950 pb-2">
                      <span className="text-xs font-mono font-bold text-white uppercase">Master 4-Shot Production Matrix (10s per Shot)</span>
                      <button
                        onClick={() => {
                          const full = affShots.map(s => `${s.title} [${s.time}]:\nVO: ${s.vo}\nAI Prompt: ${s.prompt}`).join('\n\n');
                          copyToClipboard(full, "Seluruh Naskah & Prompts 4-Shot");
                        }}
                        className="px-3 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold shadow-md flex items-center gap-1.5"
                      >
                        <IconCopy /> Salin Semua 4 Shot UGC
                      </button>
                    </div>

                    <div className="grid grid-cols-1 gap-3.5">
                      {affShots.map((shot) => (
                        <div key={shot.id} className="p-4 rounded-2xl bg-[#0a0f1d] border border-cyan-950 hover:border-cyan-800 transition-all space-y-2.5">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-amber-400 font-mono">
                              SHOT 0{shot.id} [{shot.time}] • {shot.title}
                            </span>
                            <button
                              onClick={() => copyToClipboard(`[${shot.title} | ${shot.time}]\nVO: ${shot.vo}\nPrompt: ${shot.prompt}`, `Shot 0${shot.id}`)}
                              className="px-2.5 py-1 rounded-lg bg-[#050811] hover:bg-slate-800 text-cyan-300 border border-cyan-900 text-[10px] font-mono flex items-center gap-1"
                            >
                              <IconCopy /> Salin Shot 0{shot.id}
                            </button>
                          </div>

                          <div className="text-xs text-slate-300 font-mono italic bg-[#050811] p-3 rounded-xl border border-cyan-950 leading-relaxed">
                            {shot.vo}
                          </div>

                          <div className="text-[11px] font-mono text-cyan-200 bg-[#050811] p-3 rounded-xl border border-cyan-950/80 leading-relaxed">
                            <span className="text-[9px] text-cyan-400 uppercase font-bold block mb-1">Master AI Video Prompt (English):</span>
                            {shot.prompt}
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* DISPATCHER SHORTCUTS */}
                    <div className="p-4 rounded-2xl bg-[#090e1c] border border-cyan-900 flex flex-wrap items-center justify-between gap-3 text-xs font-mono">
                      <span className="text-cyan-300 font-bold">Universal External Video AI Dispatcher:</span>
                      <div className="flex flex-wrap gap-2">
                        <button
                          onClick={() => copyToClipboard(affShots[0].prompt, "Kling AI 1.5 Prompt")}
                          className="px-3 py-1.5 rounded-lg bg-black/60 border border-cyan-800 hover:border-cyan-400 text-cyan-300 text-[11px]"
                        >
                          Format Kling AI 1.5
                        </button>
                        <button
                          onClick={() => copyToClipboard(affShots[0].prompt, "Google Flow 8s Preset")}
                          className="px-3 py-1.5 rounded-lg bg-black/60 border border-cyan-800 hover:border-cyan-400 text-teal-300 text-[11px]"
                        >
                          Format Google Flow (8s/720p)
                        </button>
                        <button
                          onClick={() => copyToClipboard(affShots[0].prompt, "Google Veo 2 Native Video")}
                          className="px-3 py-1.5 rounded-lg bg-black/60 border border-cyan-800 hover:border-cyan-400 text-amber-300 text-[11px]"
                        >
                          Format Google Veo 2
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB CONTENT: MODUL 01 - CHARACTER SHEET */}
            {activeTab === 'modul01' && (
              <div className="space-y-6">
                <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-950 space-y-4">
                  <div className="flex items-center justify-between border-b border-cyan-950 pb-3">
                    <h2 className="text-sm font-bold text-white uppercase font-mono">Character Turnaround Consistency Sheet</h2>
                    <span className="text-[10px] text-emerald-400 font-mono">Background: #FFFFFF Solid</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">Nama Karakter</label>
                      <input
                        type="text"
                        value={charName}
                        onChange={(e) => setCharName(e.target.value)}
                        className="w-full bg-[#050811] border border-cyan-950 rounded-xl px-3.5 py-2 text-xs text-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">Archetype & Wardrobe</label>
                      <input
                        type="text"
                        value={charArchetype}
                        onChange={(e) => setCharArchetype(e.target.value)}
                        className="w-full bg-[#050811] border border-cyan-950 rounded-xl px-3.5 py-2 text-xs text-white outline-none"
                      />
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-[#050811] border border-cyan-950 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-mono text-cyan-300 font-bold">Master Turnaround Prompt (4 Sudut Pandang)</span>
                      <button
                        onClick={() => copyToClipboard(charResultPrompt, "Turnaround Master Prompt")}
                        className="px-3 py-1 rounded bg-cyan-950 text-cyan-300 border border-cyan-800 text-[10px] font-mono flex items-center gap-1"
                      >
                        <IconCopy /> Salin Master Prompt
                      </button>
                    </div>
                    <div className="text-xs font-mono text-slate-300 leading-relaxed bg-[#0a0f1d] p-3 rounded-xl border border-cyan-950">
                      {charResultPrompt}
                    </div>
                  </div>

                  {/* 4 ANGLES PREVIEW CARDS */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2 text-center text-xs font-mono">
                    {['0° FRONT VIEW', '45° 3/4 VIEW', '90° PROFILE', '180° REAR VIEW'].map((angle, idx) => (
                      <div key={idx} className="p-4 rounded-xl bg-[#050811] border border-cyan-900/60 space-y-2">
                        <span className="text-[10px] text-cyan-400 font-bold block">{angle}</span>
                        <div className="h-28 rounded-lg bg-[#ffffff] flex items-center justify-center text-slate-800 font-black text-xs border border-cyan-900">
                          {charName.split(' ')[0]}
                        </div>
                        <span className="text-[9px] text-slate-400 block">Biometric Mesh 100%</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB CONTENT: MODUL 06 - STORYBOARD GRID */}
            {activeTab === 'modul06' && (
              <div className="space-y-6">
                <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-950 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-cyan-950 pb-3">
                    <div>
                      <h2 className="text-sm font-bold text-white font-mono uppercase">Storyboard Grid • Composite Document & Auto PNG</h2>
                      <span className="text-[10px] text-cyan-400 font-mono">Format 16:9 • 3840x2160 UHD</span>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => triggerToast("Mengunduh Lembar Komposit PNG (4K Ultra-HD)...")}
                        className="px-3.5 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold flex items-center gap-1.5 shadow-md"
                      >
                        <IconDownload /> Download Composite PNG
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {affShots.map((panel) => (
                      <div key={panel.id} className="p-3.5 rounded-2xl bg-[#050811] border border-cyan-950 space-y-2">
                        <div className="flex items-center justify-between text-xs font-mono">
                          <span className="text-amber-400 font-bold">{panel.title}</span>
                          <span className="text-slate-500">{panel.time}</span>
                        </div>
                        <div className="aspect-video rounded-xl bg-[#0a0f1d] border border-cyan-900/60 p-3 flex flex-col justify-between">
                          <span className="text-[10px] font-mono text-cyan-400 uppercase font-bold">{panel.focus}</span>
                          <p className="text-xs text-slate-300 italic font-mono line-clamp-2">{panel.vo}</p>
                          <span className="text-[9px] text-slate-500 font-mono">Latent Consistency Locked</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB CONTENT: MODUL 11 - VIDEO MASTERCLASS & AUDIO PANDUAN */}
            {activeTab === 'modul11' && (
              <div className="space-y-6">
                <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-950 space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-cyan-950 pb-3">
                    <div>
                      <h2 className="text-sm font-bold text-white font-mono uppercase">Pemutar Video Panduan Interaktif & Suara Narator Asli</h2>
                      <span className="text-[10px] text-cyan-400 font-mono">Google Web Speech Synthesizer Real-Time</span>
                    </div>
                    <div className="flex items-center gap-2">
                      {isPlayingAudio ? (
                        <button
                          onClick={stopVoice}
                          className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md"
                        >
                          ■ Hentikan Suara
                        </button>
                      ) : (
                        <button
                          onClick={() => speakGuideVoice("Selamat datang di studio OG AI Director Pro. Berikut adalah panduan langkah demi langkah merancang naskah 4 shot 10 detik dan mengekspor prompt ke Google Flow atau Kling AI secara instan.")}
                          className="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-400 to-teal-400 text-slate-950 text-xs font-black shadow-md flex items-center gap-2"
                        >
                          <IconPlay /> Putar Suara Panduan (Indonesia)
                        </button>
                      )}
                    </div>
                  </div>

                  {/* INTERACTIVE VIDEO SCREENCAST SIMULATOR */}
                  <div className="aspect-video rounded-2xl bg-black border border-cyan-900 p-6 flex flex-col justify-between relative overflow-hidden">
                    <div className="flex items-center justify-between text-xs font-mono text-slate-400">
                      <span className="text-cyan-400 font-bold">● SCREENCAST DEMONSTRASI AKTIF</span>
                      <span>LANGKAH {videoStep} DARI 4</span>
                    </div>

                    <div className="text-center space-y-3 py-6 max-w-lg mx-auto">
                      <div className="w-14 h-14 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-400 flex items-center justify-center mx-auto text-xl font-bold">
                        {videoStep}
                      </div>
                      <h3 className="text-base font-bold text-white">
                        {videoStep === 1 && "Langkah 1: Unggah Foto Produk di Slot Modul 03"}
                        {videoStep === 2 && "Langkah 2: Tentukan Durasi & Klik Generate Naskah"}
                        {videoStep === 3 && "Langkah 3: Periksa Naskah 4 Shot 10 Detik (@10s)"}
                        {videoStep === 4 && "Langkah 4: Salin Prompt & Paste ke Google Flow / Kling AI"}
                      </h3>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        {videoStep === 1 && "Pilih foto botol atau kemasan produk Anda dari galeri HP atau laptop agar AI mengunci bentuk dan warnanya."}
                        {videoStep === 2 && "Pilih durasi 40 detik untuk video iklan pendek, lalu tekan tombol Generate Master Naskah & Prompts."}
                        {videoStep === 3 && "Naskah Hook, Macro, Aplikasi, dan CTA langsung tersusun otomatis dengan sinkronisasi karakter 100%."}
                        {videoStep === 4 && "Gunakan tombol Universal Dispatcher untuk mengekspor ke Google Flow (preset 8 detik 720p) atau Kling AI."}
                      </p>
                    </div>

                    <div className="flex items-center justify-between pt-4 border-t border-cyan-950 text-xs font-mono">
                      <button
                        onClick={() => setVideoStep(Math.max(1, videoStep - 1))}
                        disabled={videoStep === 1}
                        className="px-3 py-1 rounded bg-[#0a0f1d] text-slate-400 disabled:opacity-30"
                      >
                        ◀ Langkah Sebelumnya
                      </button>
                      <div className="flex gap-1.5">
                        {[1, 2, 3, 4].map(s => (
                          <span key={s} className={`w-2.5 h-2.5 rounded-full ${videoStep === s ? 'bg-cyan-400' : 'bg-slate-800'}`}></span>
                        ))}
                      </div>
                      <button
                        onClick={() => setVideoStep(Math.min(4, videoStep + 1))}
                        disabled={videoStep === 4}
                        className="px-3 py-1 rounded bg-[#0a0f1d] text-cyan-300 disabled:opacity-30"
                      >
                        Langkah Berikutnya ▶
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* FALLBACK INFO JIKA MEMILIH MODUL LAIN */}
            {!['modul03', 'modul01', 'modul06', 'modul11'].includes(activeTab) && (
              <div className="p-8 rounded-3xl bg-[#0a0f1d] border border-cyan-950 text-center space-y-4">
                <div className="text-amber-400 font-mono text-xs font-bold uppercase">MODUL AKTIF TERSEDIA</div>
                <h3 className="text-lg font-bold text-white">Modul Terintegrasi di Studio Sutradara</h3>
                <p className="text-xs text-slate-400 max-w-md mx-auto">
                  Semua modul siap digunakan dan terhubung ke engine AI. Klik pada <strong>03. Affiliate Prompt</strong>, <strong>01. Character Sheet</strong>, <strong>06. Storyboard Grid</strong>, atau <strong>11. Video Masterclass</strong> untuk melihat workbench kerja lengkap!
                </p>
                <button
                  onClick={() => setActiveTab('modul03')}
                  className="px-5 py-2.5 rounded-xl bg-cyan-500 text-slate-950 text-xs font-bold shadow-lg"
                >
                  Buka Modul 03 (Affiliate Prompt)
                </button>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
