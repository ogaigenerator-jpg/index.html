<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG AI Director Pro • Studio Orkestrasi AI Video</title>
  <meta name="theme-color" content="#06b6d4" />

  <!-- Fonts Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #070b14; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #164e63; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 antialiased selection:bg-cyan-500/30">
  <div id="root"></div>

  <!-- Kode React Utama OG AI Director Pro -->
  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const TECH_GRID_SVG = `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'%3E%3Cpath d='M60 0 L0 0 0 60' fill='none' stroke='rgba(6,182,212,0.04)' stroke-width='1'/%3E%3Ccircle cx='60' cy='0' r='1' fill='rgba(245,158,11,0.1)'/%3E%3Ccircle cx='0' cy='60' r='1' fill='rgba(6,182,212,0.1)'/%3E%3C/svg%3E`;

    function App() {
      const [hasEntered, setHasEntered] = useState(false);
      const [activeTab, setActiveTab] = useState('home');

      const TABS = [
        { id: 'home', icon: '✨', title: 'Workspace Home', subtitle: 'Pusat Studio' },
        { id: 'sheets', icon: '👥', title: 'Character Sheet Studio', subtitle: 'Consistency 100%' },
        { id: 'imagegen', icon: '📸', title: 'Image Studio', subtitle: 'First Frame & Visuals' },
        { id: 'affiliate', icon: '📢', title: 'Affiliate Prompt', subtitle: 'Sales Conversion' },
        { id: 'influencer', icon: '👤', title: 'AI Influencer', subtitle: 'Virtual Talent Creator' },
        { id: 'general', icon: '🎬', title: 'General Prompt', subtitle: 'Film & Sinematik' },
        { id: 'storyboard', icon: '📑', title: 'Storyboard Grid', subtitle: 'Composite Document' },
        { id: 'pipeline', icon: '🚀', title: 'AI Generator', subtitle: 'Jalur Produksi Terpadu' },
        { id: 'multichar', icon: '🎥', title: 'Generative AI (AI Gen)', subtitle: 'Spesial Dialog & Aksi' },
      ];

      if (!hasEntered) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen w-full bg-[#070b14] px-4" style={{ backgroundImage: `url("${TECH_GRID_SVG}")`, backgroundSize: '60px' }}>
            <div className="relative text-center space-y-6 max-w-xl w-full p-8 rounded-3xl bg-[#0a0f1d]/90 border border-cyan-800/40 backdrop-blur-xl shadow-2xl">
              <div className="text-4xl">🎬</div>
              <h1 className="text-3xl sm:text-4xl font-black text-white">
                OG AI <span className="bg-gradient-to-r from-cyan-400 via-teal-300 to-amber-300 bg-clip-text text-transparent">DIRECTOR PRO</span>
              </h1>
              <p className="text-gray-400 text-xs sm:text-sm">Studio orkestrasi konten dan sutradara video AI profesional. 100% Locked Consistency & Google Flow Ready.</p>
              <button onClick={() => setHasEntered(true)} className="px-8 py-3.5 bg-gradient-to-r from-cyan-500 via-teal-400 to-emerald-400 text-[#050b14] font-black text-sm rounded-xl shadow-lg hover:scale-105 transition-all cursor-pointer">
                MASUK KE STUDIO SUTRADARA ➔
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen w-full bg-[#070b14] text-gray-100 overflow-hidden" style={{ backgroundImage: `url("${TECH_GRID_SVG}")`, backgroundSize: '60px' }}>
          <aside className="w-64 bg-[#0a0f1d]/95 border-r border-cyan-950 flex flex-col">
            <div className="p-5 border-b border-cyan-950 flex items-center gap-3">
              <div className="text-xl">🎬</div>
              <div>
                <div className="font-black text-sm text-white">OG AI DIRECTOR</div>
                <div className="text-[10px] text-cyan-400 font-mono">PRO LIFETIME</div>
              </div>
            </div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1 custom-scrollbar">
              {TABS.map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-3 px-3 py-2.5 rounded-xl w-full text-left text-xs font-bold transition-all cursor-pointer ${activeTab === tab.id ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'text-gray-400 hover:text-white'}`}>
                  <span>{tab.icon}</span>
                  <span>{tab.title}</span>
                </button>
              ))}
            </nav>
          </aside>

          <main className="flex-1 flex flex-col h-full overflow-hidden">
            <header className="h-16 px-6 border-b border-cyan-950/80 bg-[#0a0f1d]/60 flex items-center justify-between">
              <h2 className="text-base font-black text-white">{TABS.find(t => t.id === activeTab)?.title}</h2>
              <span className="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-bold">🟢 Live di Vercel</span>
            </header>
            <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
              <div className="p-6 rounded-3xl bg-cyan-950/30 border border-cyan-800/40 space-y-3">
                <h3 className="text-lg font-black text-white">Selamat Datang di Studio Sutradara</h3>
                <p className="text-xs text-gray-300">Website Anda sudah berhasil online secara resmi di Vercel dan siap dipakai siapa saja!</p>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
